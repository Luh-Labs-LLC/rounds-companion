name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # The xcode-27 image ships 27.0, 27.1 (default) and 27.2. Firebase 12.19.3
  # predates 27.2, so select 27.1 explicitly.
  XCODE_APP: /Applications/Xcode_27.1.app
  PROJECT: ios/RoundsCompanion.xcodeproj
  SCHEME: RoundsCompanion

jobs:
  compile:
    name: Compile (unsigned, no secrets)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Use the placeholder Firebase config
        run: cp ios/RoundsCompanion/GoogleService-Info.plist.example ios/RoundsCompanion/GoogleService-Info.plist

      - name: Generate the Xcode project
        run: cd ios && xcodegen generate

      - name: Build for device without signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

  testflight:
    name: Archive and upload to TestFlight
    needs: compile
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
    steps:
      - name: Check that signing secrets exist
        id: secrets
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 GOOGLE_SERVICE_INFO_PLIST_BASE64; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Skipping TestFlight upload; missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - name: Select Xcode
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        if: steps.secrets.outputs.ready == 'true'
        run: brew install xcodegen

      - name: Write secrets to disk
        if: steps.secrets.outputs.ready == 'true'
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/RoundsCompanion/GoogleService-Info.plist
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Generate the Xcode project
        if: steps.secrets.outputs.ready == 'true'
        run: cd ios && xcodegen generate

      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RoundsCompanion.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | xcbeautify

      - name: Export and upload to App Store Connect
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RoundsCompanion.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify

      - name: Remove secrets from disk
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" ios/RoundsCompanion/GoogleService-Info.plist
