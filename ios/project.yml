# XcodeGen spec. CI runs `xcodegen generate` to produce RoundsCompanion.xcodeproj,
# so no hand-written .pbxproj is committed. See README "Third-party tools".
name: RoundsCompanion

options:
  bundleIdPrefix: com.getstatlab
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"   # CI overrides with the workflow run number
    SWIFT_VERSION: "5.0"   # Swift 5 mode: fewer strict-concurrency surprises while we cannot compile locally
    DEVELOPMENT_TEAM: ""           # CI passes the team ID from a secret
    CODE_SIGN_STYLE: Automatic

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # Pinned on purpose. Hybrid inference (HybridModel, SystemLanguageModel,
    # GenerativeModelSession) shipped in 12.13.0 and was removed in 13.0.0
    # (see FirebaseAI/CHANGELOG.md in the SDK). 12.19.3 is the last 12.x release.
    exactVersion: 12.19.3
  RoundsKit:
    # Local package: shot records, shorthand parser, round stats (tested in CI with `swift test`).
    path: RoundsKit

schemes:
  # Declared explicitly so CI's `-scheme RoundsCompanion` never depends on
  # xcodebuild auto-creating one.
  RoundsCompanion:
    build:
      targets:
        RoundsCompanion: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  RoundsCompanion:
    type: application
    platform: iOS
    sources:
      - path: RoundsCompanion
        excludes:
          - "**/*.example"
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: RoundsKit
    entitlements:
      path: RoundsCompanion/RoundsCompanion.entitlements
      properties:
        # App Check rejects App Attest sandbox tokens, so this is production
        # for every build (Firebase App Check docs, App Attest provider page).
        com.apple.developer.devicecheck.appattest-environment: production
    info:
      path: RoundsCompanion/Info.plist
      properties:
        CFBundleDisplayName: Rounds
        LSRequiresIPhoneOS: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Rounds listens when you tap the mic so you can log a shot by voice. Audio stays on this iPhone.
        NSSpeechRecognitionUsageDescription: Rounds turns what you say about a shot into a shot record. Recognition runs on this iPhone, so audio is not sent anywhere.
        # Apps built with the iOS 27 SDK must adopt the scene lifecycle or they
        # crash at launch; SwiftUI uses scenes, and this states it explicitly.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        # The one place the bundle ID lives. It must match the App ID in the
        # Apple developer account and the BUNDLE_ID in GoogleService-Info.plist.
        PRODUCT_BUNDLE_IDENTIFIER: com.getstatlab.roundscompanion
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Release (TestFlight/App Store) signs manually with the team's Apple
        # Distribution certificate and this app's App Store profile, both
        # installed by CI from secrets. Debug keeps automatic signing.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Rounds Companion App Store
